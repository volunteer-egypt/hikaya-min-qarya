<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة إدارة حكاية من قرية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --sand:#f4ead7; --cream:#fffaf1; --ink:#263b2c; --green:#2f4a38;
  --gold:#c9a34d; --rust:#b5673f; --muted:#687565; --line:#e4d6b9;
  --shadow-sm:0 6px 18px rgba(52,53,31,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Cairo",system-ui,sans-serif;background:radial-gradient(ellipse at top,#fffaf0 0,#f4ead7 60%,#eee0c4 100%);color:var(--ink);line-height:1.8;min-height:100vh}
.wrap{width:min(1060px,94%);margin:26px auto 60px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h1{margin:0;color:var(--green);font-size:26px}
.head .sub{color:var(--muted);font-size:13.5px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{font-family:inherit;font-weight:800;font-size:14px;padding:9px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--cream);color:var(--green);cursor:pointer}
.tabs button.active{background:var(--green);color:#fff;border-color:var(--green)}
.panel{background:rgba(255,250,241,.9);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:var(--shadow-sm)}
h2{margin:0 0 6px;color:var(--green);font-size:20px}
h3{margin:0 0 10px;color:var(--green);font-size:16.5px}
.hint{color:var(--muted);font-size:13px;margin:0 0 16px}
.item{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;background:#fff;border:1px solid #eee0c4;border-radius:16px;padding:12px 16px;margin-bottom:10px}
.item img{width:64px;height:64px;object-fit:cover;border-radius:12px;background:#f3ead6}
.item h3{margin:0;font-size:15.5px}
.item p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.abtn{font-family:inherit;font-weight:800;font-size:13.5px;padding:8px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--cream);color:var(--green);cursor:pointer}
.abtn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.abtn.danger{background:#fff;color:#a33;border-color:#e4b9b0}
.abtn:disabled{opacity:.55;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.form{background:#fff;border:1px solid #eee0c4;border-radius:18px;padding:20px;margin-top:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid .wide{grid-column:1/-1}
label{display:block;font-size:13px;font-weight:800;color:var(--green);margin-bottom:4px}
input[type=text],input[type=url],input[type=tel],input[type=date],textarea,select{
  width:100%;font-family:inherit;font-size:14px;padding:9px 12px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--cream);color:var(--ink);
}
textarea{min-height:90px;resize:vertical}
textarea.big{min-height:220px}
.file-note{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.cur{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.cur img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.cur audio{width:100%;height:36px}
.msg{position:fixed;bottom:18px;right:18px;left:18px;max-width:560px;margin:auto;padding:12px 18px;border-radius:14px;font-weight:800;font-size:14px;text-align:center;display:none;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.msg.ok{display:block;background:#e6f4ea;color:#1c6b35;border:1.5px solid #b7dec2}
.msg.err{display:block;background:#fdeaea;color:#9c2b1f;border:1.5px solid #efc4bc}
.msg.info{display:block;background:#fdf3dd;color:#8a6a2f;border:1.5px solid #ecd9a8}
.badge-ok{display:inline-block;background:#e6f4ea;color:#1c6b35;font-size:11.5px;font-weight:800;border-radius:8px;padding:1px 8px}
.ph-flag{display:inline-block;font-size:11px;font-weight:800;color:#8a6a2f;background:#f7ecd2;border:1px solid #e3cfa0;border-radius:8px;padding:1px 10px}
.dot{width:16px;height:16px;border-radius:50%;background:#cfc3a5;align-self:center}
.dot.on{background:#4c9a5f;box-shadow:0 0 0 4px rgba(76,154,95,.18)}
.center{text-align:center;padding:70px 20px;color:var(--muted)}
.spin{display:inline-block;width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:sp 1s linear infinite;margin-bottom:10px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:640px){.fgrid{grid-template-columns:1fr}.item{grid-template-columns:48px 1fr}.item img{width:48px;height:48px}.item .actions{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>لوحة إدارة المحتوى</h1>
      <div class="sub">حكاية من قرية · صوت الماضي — كل تعديل يُحفظ في جدول Google ويظهر على الموقع لجميع الزوار</div>
    </div>
    <div class="actions">
      <button class="abtn" id="reloadBtn">إعادة تحميل المحتوى</button>
      <button class="abtn primary" id="saveBtn">حفظ كل التعديلات</button>
    </div>
  </div>

  <div id="loading" class="center"><span class="spin"></span><br>جاري تحميل المحتوى من جدول Google…</div>

  <div id="shell" style="display:none">
    <div class="tabs" id="tabs">
      <button data-tab="stories" class="active">الحكايات</button>
      <button data-tab="sections">أقسام الموقع</button>
      <button data-tab="elders">الشيوخ</button>
      <button data-tab="activities">الأنشطة</button>
      <button data-tab="gallery">معرض الصور</button>
      <button data-tab="press">الصحافة والإعلام</button>
      <button data-tab="partners">الشركاء</button>
      <button data-tab="team">فريق المبادرة</button>
      <button data-tab="settings">إعدادات عامة</button>
    </div>
    <div class="panel" id="panel"></div>
  </div>
</div>
<div class="msg" id="msg"></div>

<script>
"use strict";
let DATA = null;
let currentTab = "stories";
let dirty = false;

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function msg(text, kind){
  const el = $("#msg");
  el.className = "msg " + kind;
  el.textContent = text;
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = "msg"; }, 6000);
}

/* ====== الاتصال بالخادم ====== */
function call(fn, ...args){
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(err => reject(new Error(err && err.message ? err.message : String(err))))
      [fn](...args);
  });
}

async function load(){
  $("#loading").style.display = "block";
  $("#shell").style.display = "none";
  try {
    DATA = await call("apiGetData");
    dirty = false;
    $("#loading").style.display = "none";
    $("#shell").style.display = "block";
    render();
  } catch (e) {
    $("#loading").innerHTML = "تعذر تحميل المحتوى: " + esc(e.message) + "<br><br><button class='abtn primary' onclick='load()'>إعادة المحاولة</button>";
  }
}

async function save(){
  if (!DATA) return;
  $("#saveBtn").disabled = true;
  msg("جاري الحفظ في جدول Google…", "info");
  try {
    await call("apiSaveContent", DATA);
    dirty = false;
    msg("تم الحفظ. التعديلات ظاهرة الآن على الموقع لجميع الزوار.", "ok");
    render();
  } catch (e) {
    msg("فشل الحفظ: " + e.message, "err");
  } finally {
    $("#saveBtn").disabled = false;
  }
}

/* ====== الوسائط ====== */
function readImageResized(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith("image/")) return reject(new Error("not-image"));
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, (maxDim || 1600) / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve({ base64: c.toDataURL("image/jpeg", quality || 0.82).split(",")[1], mime: "image/jpeg" });
    };
    img.onerror = reject;
    img.src = url;
  });
}
function readRaw(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve({ base64: String(r.result).split(",")[1], mime: file.type || "application/octet-stream" });
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
let mediaSeq = 0;
async function uploadImage(file, maxDim, quality){
  const r = await readImageResized(file, maxDim, quality);
  const name = "img-" + Date.now() + "-" + (++mediaSeq) + ".jpg";
  const out = await call("apiUploadMedia", name, r.mime, r.base64);
  return out.url;
}
async function uploadAudio(file){
  if (file.size > 30 * 1024 * 1024) throw new Error("الملف الصوتي أكبر من 30 ميجابايت");
  const r = await readRaw(file);
  const ext = (file.name.match(/\.(\w+)$/) || [0, "mp3"])[1];
  const name = "audio-" + Date.now() + "-" + (++mediaSeq) + "." + ext;
  const out = await call("apiUploadMedia", name, r.mime, r.base64);
  return out.url;
}
function bindImageInput(sel, assign, maxDim){
  $(sel).addEventListener("change", async e => {
    const f = e.target.files[0];
    if (!f) return;
    msg("جاري رفع الصورة إلى Google Drive…", "info");
    try {
      const url = await uploadImage(f, maxDim || 1600, 0.82);
      assign(url);
      msg("تم رفع الصورة.", "ok");
    } catch (err) { msg("تعذر رفع الصورة: " + err.message, "err"); }
  });
}
function bindAudioInput(sel, assign){
  $(sel).addEventListener("change", async e => {
    const f = e.target.files[0];
    if (!f) return;
    msg("جاري رفع التسجيل إلى Google Drive…", "info");
    try {
      const url = await uploadAudio(f);
      assign(url);
      msg("تم رفع التسجيل.", "ok");
    } catch (err) { msg("تعذر رفع التسجيل: " + err.message, "err"); }
  });
}

/* ====== التبويبات ====== */
$("#tabs").querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
  $("#tabs").querySelectorAll("button").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  currentTab = b.dataset.tab;
  render();
}));
$("#saveBtn").addEventListener("click", save);
$("#reloadBtn").addEventListener("click", () => {
  if (dirty && !confirm("لديك تعديلات غير محفوظة. إعادة التحميل ستلغيها. متابعة؟")) return;
  load();
});
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

function markDirty(){ dirty = true; msg("لديك تعديلات غير محفوظة — اضغط «حفظ كل التعديلات».", "info"); }

function render(){
  const p = $("#panel");
  ({ stories: rStories, sections: rSections, elders: rElders, activities: rActivities,
     gallery: rGallery, press: rPress, partners: rPartners, team: rTeam, settings: rSettings })[currentTab](p);
  p.querySelectorAll("input,textarea,select").forEach(el => el.addEventListener("input", markDirty));
}

/* ====== الحكايات ====== */
function rStories(p){
  p.innerHTML = `
    <h2>الحكايات (${DATA.stories.length})</h2>
    <p class="hint">تعديل النصوص والأغلفة والتسجيلات. استبدال أي تسجيل أصلي يتم فقط بموافقة صاحب المشروع — الأصل لا يُحذف من Drive.</p>
    ${DATA.stories.map(s => `
      <div class="item">
        <img src="${esc(s.cover)}" alt="">
        <div>
          <h3>${esc(s.title)}</h3>
          <p>${s.audio ? '<span class="badge-ok">يوجد تسجيل</span>' : "بدون تسجيل"} · ${String(s.text||"").length} حرف</p>
        </div>
        <div class="actions">
          <button class="abtn primary" data-edit="${s.id}">تعديل</button>
          <button class="abtn danger" data-del="${s.id}">حذف</button>
        </div>
      </div>`).join("")}
    <div class="actions" style="margin-top:14px"><button class="abtn primary" id="addStory">＋ إضافة حكاية جديدة</button></div>
    <div id="formHost"></div>`;
  p.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => storyForm(+b.dataset.edit)));
  p.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
    const s = DATA.stories.find(x => x.id === +b.dataset.del);
    if (s && confirm(`حذف حكاية «${s.title}» من الموقع؟`)) {
      DATA.stories = DATA.stories.filter(x => x.id !== s.id);
      markDirty(); render();
    }
  }));
  $("#addStory").addEventListener("click", () => storyForm(null));
}
function storyForm(id){
  const s = id ? DATA.stories.find(x => x.id === id) : { id: Date.now(), title: "", desc: "", text: "", cover: "", audio: "" };
  $("#formHost").innerHTML = `
    <div class="form">
      <h3>${id ? "تعديل حكاية: " + esc(s.title) : "حكاية جديدة"}</h3>
      <div class="fgrid">
        <div><label>عنوان الحكاية</label><input type="text" id="f_title" value="${esc(s.title)}"></div>
        <div><label>وصف مختصر</label><input type="text" id="f_desc" value="${esc(s.desc)}"></div>
        <div class="wide"><label>نص الحكاية الكامل</label><textarea class="big" id="f_text">${esc(s.text)}</textarea></div>
        <div><label>الغلاف</label><input type="file" id="f_cover" accept="image/\u002A">
          <span class="file-note">يُرفع إلى Drive ويظهر رابطه هنا.</span>
          <input type="text" id="f_coverurl" value="${esc(s.cover)}" dir="ltr">
          <div class="cur">${s.cover ? `<img src="${esc(s.cover)}">` : ""}</div></div>
        <div><label>التسجيل الصوتي (MP3)</label><input type="file" id="f_audio" accept="audio/\u002A">
          <input type="text" id="f_audiourl" value="${esc(s.audio)}" dir="ltr">
          <div class="cur">${s.audio ? `<audio controls src="${esc(s.audio)}"></audio>` : ""}</div></div>
      </div>
      <div class="actions" style="margin-top:14px">
        <button class="abtn primary" id="f_save">تم — أضِف للتعديلات</button>
        <button class="abtn" id="f_cancel">إلغاء</button>
      </div>
    </div>`;
  $("#formHost").scrollIntoView({ behavior: "smooth" });
  bindImageInput("#f_cover", url => { $("#f_coverurl").value = url; markDirty(); });
  bindAudioInput("#f_audio", url => { $("#f_audiourl").value = url; markDirty(); });
  $("#f_cancel").addEventListener("click", () => { $("#formHost").innerHTML = ""; });
  $("#f_save").addEventListener("click", () => {
    s.title = $("#f_title").value.trim();
    s.desc = $("#f_desc").value.trim();
    s.text = $("#f_text").value;
    s.cover = $("#f_coverurl").value.trim();
    s.audio = $("#f_audiourl").value.trim();
    if (!s.title) { msg("اكتب عنوان الحكاية أولًا.", "err"); return; }
    if (!id) DATA.stories.push(s);
    markDirty(); render();
  });
}

/* ====== أقسام الموقع ====== */
const SECTION_DEFS = [
  ["hero","الواجهة الرئيسية"],["elders","الشيوخ"],["stories","مكتبة الحكايات"],
  ["visuals","معرض الصور"],["activities","الأنشطة"],["initiative","عن المبادرة"],
  ["press","الصحافة والإعلام"],["partners","شركاء النجاح"],["team","فريق عمل المبادرة"]
];
function rSections(p){
  const vis = DATA.sectionVisibility = DATA.sectionVisibility || {};
  p.innerHTML = `
    <h2>أقسام الموقع</h2>
    <p class="hint">إظهار أو إخفاء أي قسم على الموقع العام دون فقدان محتواه. يحتاج التغيير ضغطة «حفظ كل التعديلات» ليظهر للزوار.</p>
    ${SECTION_DEFS.map(([id, label]) => {
      const on = vis[id] !== false;
      return `<div class="item">
        <div class="dot${on ? " on" : ""}"></div>
        <div><h3>${esc(label)}</h3></div>
        <div class="actions"><button class="abtn ${on ? "danger" : "primary"}" data-tgl="${id}">${on ? "إخفاء" : "إظهار"}</button></div>
      </div>`;
    }).join("")}`;
  p.querySelectorAll("[data-tgl]").forEach(b => b.addEventListener("click", () => {
    vis[b.dataset.tgl] = vis[b.dataset.tgl] === false;
    markDirty(); render();
  }));
}

/* ====== الشيوخ ====== */
function rElders(p){
  const em = DATA.eldersMessages;
  p.innerHTML = `
    <h2>الشيوخ: رسائل كبار شمال سيناء للأطفال</h2>
    <p class="hint">لا يُنشر اسم أو نص أو صورة أو تسجيل حقيقي إلا بعد اعتماد صاحب المشروع للمتحدثين والمواد.</p>
    <div class="form" style="margin-top:0">
      <h3>عنوان ومقدمة المساحة</h3>
      <div class="fgrid">
        <div class="wide"><label>العنوان</label><input type="text" id="em_title" value="${esc(em.title)}"></div>
        <div class="wide"><label>المقدمة</label><textarea id="em_intro">${esc(em.intro)}</textarea></div>
      </div>
    </div>
    ${em.items.map(m => `
      <div class="item">
        ${m.portrait ? `<img src="${esc(m.portrait)}" style="border-radius:50%">` : "<div></div>"}
        <div>
          <h3>${esc(m.name)} ${m.placeholder ? '<span class="ph-flag">مؤقت</span>' : '<span class="badge-ok">معتمد</span>'}</h3>
          <p>${m.audio ? '<span class="badge-ok">يوجد تسجيل</span>' : "بدون تسجيل"}</p>
        </div>
        <div class="actions"><button class="abtn primary" data-edit="${m.id}">تعديل</button></div>
      </div>`).join("")}
    <div id="formHost"></div>`;
  $("#em_title").addEventListener("input", () => { em.title = $("#em_title").value; markDirty(); });
  $("#em_intro").addEventListener("input", () => { em.intro = $("#em_intro").value; markDirty(); });
  p.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => elderForm(b.dataset.edit)));
}
function elderForm(id){
  const m = DATA.eldersMessages.items.find(x => x.id === id);
  if (!m) return;
  $("#formHost").innerHTML = `
    <div class="form">
      <h3>تعديل رسالة</h3>
      <div class="fgrid">
        <div><label>اسم المتحدث</label><input type="text" id="f_name" value="${esc(m.name)}"></div>
        <div><label>حالة الاعتماد</label><select id="f_ph">
          <option value="1"${m.placeholder ? " selected" : ""}>مؤقت — بانتظار الاعتماد</option>
          <option value="0"${m.placeholder ? "" : " selected"}>معتمد من صاحب المشروع</option>
        </select></div>
        <div class="wide"><label>نص الرسالة</label><textarea class="big" id="f_text">${esc(m.text)}</textarea></div>
        <div><label>صورة المتحدث</label><input type="file" id="f_portrait" accept="image/\u002A">
          <input type="text" id="f_portraiturl" value="${esc(m.portrait || "")}" dir="ltr">
          <div class="cur">${m.portrait ? `<img src="${esc(m.portrait)}" style="border-radius:50%">` : ""}</div></div>
        <div><label>التسجيل الصوتي</label><input type="file" id="f_audio" accept="audio/\u002A">
          <input type="text" id="f_audiourl" value="${esc(m.audio || "")}" dir="ltr">
          <div class="cur">${m.audio ? `<audio controls src="${esc(m.audio)}"></audio>` : ""}</div></div>
      </div>
      <div class="actions" style="margin-top:14px">
        <button class="abtn primary" id="f_save">تم — أضِف للتعديلات</button>
        <button class="abtn" id="f_cancel">إلغاء</button>
      </div>
    </div>`;
  $("#formHost").scrollIntoView({ behavior: "smooth" });
  bindImageInput("#f_portrait", url => { $("#f_portraiturl").value = url; markDirty(); }, 800);
  bindAudioInput("#f_audio", url => { $("#f_audiourl").value = url; markDirty(); });
  $("#f_cancel").addEventListener("click", () => { $("#formHost").innerHTML = ""; });
  $("#f_save").addEventListener("click", () => {
    m.name = $("#f_name").value.trim() || m.name;
    m.text = $("#f_text").value;
    m.placeholder = $("#f_ph").value === "1";
    m.portrait = $("#f_portraiturl").value.trim();
    m.audio = $("#f_audiourl").value.trim();
    markDirty(); render();
  });
}

/* ====== الأنشطة ====== */
function rActivities(p){
  p.innerHTML = `
    <h2>الأنشطة (${DATA.activities.length})</h2>
    <p class="hint">توثيق الأنشطة الميدانية بصورها الحقيقية، وربط كل نشاط بالحكاية التي ألهمته.</p>
    ${DATA.activities.map(a => `
      <div class="item">

function actForm(id){

  a.images = a.images || [];
  const drawImgs = () => { $("#actImgs").innerHTML = a.images.map((im, i) => `<img src="${esc(im)}" data-i="${i}" title="اضغط للحذف">`).join(""); };
  $("#formHost").innerHTML = `

          <div class="cur" id="actImgs"></div></div>
      </div>
      <div class="actions" style="margin-top:14px">

        <button class="abtn" id="f_cancel">إلغاء</button>
      </div>
    </div>`;
  drawImgs();
  $("#formHost").scrollIntoView({ behavior: "smooth" });

  });
  $("#f_imgs").addEventListener("change", async e => {
    for (const f of [...e.target.files].slice(0, 12)) {
      msg("جاري رفع صورة…", "info");
      try { a.images.push(await uploadImage(f, 1600, 0.8)); drawImgs(); markDirty(); } catch (err) { msg("تعذر رفع صورة.", "err"); }
    }
    msg("اكتمل رفع الصور.", "ok");
  });
  $("#f_cancel").addEventListener("click", () => { $("#formHost").innerHTML = ""; });
  $("#f_save").addEventListener("click", () => {
    a.title = $("#f_title").value.trim();
    a.desc = $("#f_desc").value.trim();
    a.place = $("#f_place").value.trim();

    if (!id) DATA.activities.push(a);
    markDirty(); render();
  });
}

    </div>`;

    const img = e.target.closest("img[data-i]");

  });
  $("#f_imgs").addEventListener("change", async e => {
    for (const f of [...e.target.files].slice(0, 18)) {
      msg("جاري رفع صورة…", "info");

function pressForm(id){
  const it = id ? DATA.press.find(x => x.id === id) : { id: "pr-" + Date.now(), category: "news", outlet: "", title: "", date: "", url: "", text: "", image: "", photos: [] };
  it.photos = it.photos || [];

  $("#formHost").innerHTML = `
    <div class="form">
      <h3>${id ? "تعديل الخبر / المقال" : "خبر أو مقال جديد"}</h3>
      <div class="fgrid">
        <div><label>التصنيف</label><select id="f_cat">${DATA.pressCategories.map(c => `<option value="${c.id}"${c.id === it.category ? " selected" : ""}>${esc(c.label)}</option>`).join("")}</select></div>

        <div><label>تاريخ النشر</label><input type="date" id="f_date" value="${esc(it.date)}"></div>
        <div class="wide"><label>عنوان الخبر أو المقال</label><input type="text" id="f_title" value="${esc(it.title || it.headline || "")}"></div>
        <div class="wide"><label>رابط الخبر الأصلي (اختياري)</label><input type="url" id="f_url" value="${esc(it.url)}" dir="ltr"></div>
        <div class="wide"><label>نص المقال / الخبر</label><textarea class="big" id="f_text">${esc(it.text || it.description || "")}</textarea></div>
        <div><label>صورة الخبر</label><input type="file" id="f_cover" accept="image/\u002A">
          <input type="text" id="f_coverurl" value="${esc(it.image || it.cover || "")}" dir="ltr">
          <div class="cur">${(it.image || it.cover) ? `<img src="${esc(it.image || it.cover)}">` : ""}</div></div>
        <div><label>صور إضافية (اختياري)</label><input type="file" id="f_photos" accept="image/\u002A" multiple>
          <div class="cur" id="pressPhotos"></div></div>
      </div>
      <div class="actions" style="margin-top:14px">
        <button class="abtn primary" id="f_save">تم — أضِف للتعديلات</button>
        <button class="abtn" id="f_cancel">إلغاء</button>
      </div>
    </div>`;
  drawPhotos();
  $("#formHost").scrollIntoView({ behavior: "smooth" });
  bindImageInput("#f_cover", url => { $("#f_coverurl").value = url; markDirty(); });
  $("#pressPhotos").addEventListener("click", e => {
    const img = e.target.closest("img[data-i]");
    if (img && confirm("حذف هذه الصورة؟")) { it.photos.splice(+img.dataset.i, 1); drawPhotos(); markDirty(); }
  });
  $("#f_photos").addEventListener("change", async e => {
    for (const f of [...e.target.files].slice(0, 12)) {
      try { it.photos.push(await uploadImage(f, 1400, 0.78)); drawPhotos(); markDirty(); } catch (err) {}
    }
  });
  $("#f_cancel").addEventListener("click", () => { $("#formHost").innerHTML = ""; });
  $("#f_save").addEventListener("click", () => {
    it.category = $("#f_cat").value;
    it.outlet = $("#f_outlet").value.trim();
    it.title = $("#f_title").value.trim();
    it.headline = it.title;
    it.date = $("#f_date").value;
    it.url = $("#f_url").value.trim();
    it.text = $("#f_text").value.trim();
    it.description = it.text;
    it.image = $("#f_coverurl").value.trim();
    it.cover = it.image;
    delete it.author;
    if (!it.title) { msg("اكتب عنوان الخبر أولًا.", "err"); return; }
    if (!id) DATA.press.push(it);
    markDirty(); render();
  });
}
