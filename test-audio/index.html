<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>اختبار صوت Drive (صفحة داخلية)</title>
<style>body{font-family:sans-serif;background:#f5f1e6;padding:24px;max-width:640px;margin:auto}audio{width:100%;margin:8px 0}#log{white-space:pre-wrap;font-family:monospace;font-size:12px;background:#fff;border:1px solid #ccc;padding:12px;border-radius:8px;min-height:200px}</style>
</head>
<body>
<h1>اختبار بث الصوت من Drive — صفحة داخلية غير مرتبطة</h1>
<audio id="a" controls preload="none" src="https://drive.google.com/uc?export=download&id=1etd8uvabtUwMBslfgCjLUexx7GnQ_0ZU"></audio>
<div id="log"></div>
<script>
var log=document.getElementById('log'), a=document.getElementById('a');
function L(m){log.textContent+=m+'\n';}
['loadstart','canplay','playing','waiting','seeking','seeked','error','stalled','timeupdate'].forEach(function(ev){
  a.addEventListener(ev,function(){L(ev+' @'+a.currentTime.toFixed(1)+'s readyState='+a.readyState);});
});
window.runSeekTest=function(){
  return new Promise(function(res){
    var t0=performance.now();
    a.addEventListener('canplay',function once(){
      a.removeEventListener('canplay',once);
      L('TIME_TO_CANPLAY_MS='+(performance.now()-t0).toFixed(0));
      var d=a.duration;
      L('DURATION='+d);
      a.currentTime=Math.max(1,d*0.6);
      var t1=performance.now();
      a.addEventListener('seeked',function once2(){
        a.removeEventListener('seeked',once2);
        L('SEEK_MS='+(performance.now()-t1).toFixed(0)+' to '+a.currentTime.toFixed(1)+'s');
        a.play().then(function(){
          setTimeout(function(){a.pause();res('PLAY_AFTER_SEEK_OK pos='+a.currentTime.toFixed(1));},1500);
        }).catch(function(e){res('PLAY_FAIL:'+e.message);});
      });
    });
    a.load();
  });
};
</script>
</body>
</html>
