<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة الإدارة | حكاية من قرية · صوت الماضي</title>
<link rel="icon" href="assets/img/logo-initiative.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="admin-body">

<!-- بوابة الدخول -->
<div class="gate" id="gate">
  <img src="assets/img/logo-initiative.webp" alt="شعار المبادرة">
  <h1>لوحة إدارة حكاية من قرية</h1>
  <p id="gateText">أدخل رمز الإدارة للمتابعة.</p>
  <input type="password" id="gateInput" placeholder="رمز الإدارة" autocomplete="current-password">
  <input type="password" id="gateInput2" placeholder="تأكيد الرمز الجديد" style="display:none;margin-top:8px">
  <button class="btn" id="gateBtn">دخول</button>
  <div class="err" id="gateErr">الرمز غير صحيح.</div>
</div>

<!-- اللوحة -->
<div class="admin-shell" id="adminShell" style="display:none">
  <div class="admin-head">
    <div>
      <h1>لوحة إدارة المحتوى</h1>
      <div class="sub">حكاية من قرية · صوت الماضي — التعديلات تُحفظ وتظهر على الموقع فورًا</div>
    </div>
    <div>
      <a class="abtn" href="index.html" target="_blank">معاينة الموقع ↗</a>
      <button class="abtn danger" id="logoutBtn" type="button">خروج</button>
    </div>
  </div>

  <div class="admin-tabs" id="adminTabs">
    <button data-tab="stories" class="active">الحكايات</button>
    <button data-tab="sections">أقسام الموقع</button>
    <button data-tab="elders">الشيوخ</button>
    <button data-tab="activities">الأنشطة</button>
    <button data-tab="gallery">معرض الصور</button>
    <button data-tab="press">الصحافة والإعلام</button>
    <button data-tab="partners">الشركاء</button>
    <button data-tab="team">فريق المبادرة</button>
    <button data-tab="data">النسخ والمزامنة</button>
  </div>

  <div class="admin-panel" id="panel"></div>
  <div class="admin-msg" id="adminMsg"></div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
